<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 40 600 500" width="100%" height="100%">
  <defs>
    <!-- RED RIBBON GRADIENTS -->
    <linearGradient id="favRedMain" x1="20%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#7B0F16" />
      <stop offset="35%" stop-color="#A41821" />
      <stop offset="70%" stop-color="#D61F2C" />
      <stop offset="100%" stop-color="#8F1018" />
    </linearGradient>
    <linearGradient id="favRedFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A050A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#8B0F17" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="favRedGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- GREEN RIBBON GRADIENTS -->
    <linearGradient id="favGreenMain" x1="30%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#015233" />
      <stop offset="40%" stop-color="#017C4D" />
      <stop offset="75%" stop-color="#02A869" />
      <stop offset="100%" stop-color="#01663F" />
    </linearGradient>
    <linearGradient id="favGreenFold" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#00331F" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#017C4D" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="favGreenGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- ORANGE PARALLELOGRAM GRADIENTS -->
    <linearGradient id="favOrangeMain" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E55F00" />
      <stop offset="45%" stop-color="#FE7914" />
      <stop offset="85%" stop-color="#FFA04D" />
      <stop offset="100%" stop-color="#F26C05" />
    </linearGradient>
    <linearGradient id="favOrangeGloss" x1="30%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- AMBIENT SHADOW FILTER -->
    <filter id="favShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- High-Contrast White Contour Underlay (prevents #A41821 blending into #A41821 title bar) -->
  <g stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="#FFFFFF" opacity="0.98" filter="url(#favShadow)">
    <path d="M 85 510 L 295 68 L 375 68 L 255 365 L 185 510 Z" />
    <path d="M 368 68 L 440 68 L 542 365 L 425 365 Z" />
    <path d="M 255 365 L 542 365 L 615 510 L 330 510 Z" />
  </g>

  <!-- 3D Ribbon Layers -->
  <g>
    <!-- 1. RED RIBBON -->
    <path d="M 85 510 L 295 68 L 375 68 L 255 365 L 185 510 Z" fill="url(#favRedMain)" />
    <path d="M 295 68 L 375 68 L 255 365 C 285 240, 275 140, 295 68 Z" fill="url(#favRedFold)" />
    <path d="M 115 480 L 295 85 C 265 140, 230 260, 160 480 Z" fill="url(#favRedGloss)" />

    <!-- 2. GREEN RIBBON -->
    <path d="M 368 68 L 440 68 L 542 365 L 425 365 Z" fill="url(#favGreenMain)" />
    <path d="M 368 68 L 410 68 L 425 150 L 380 150 Z" fill="url(#favGreenFold)" />
    <path d="M 395 80 L 435 80 L 515 350 C 475 260, 440 180, 395 80 Z" fill="url(#favGreenGloss)" />

    <!-- 3. ORANGE RIBBON -->
    <path d="M 255 365 L 542 365 L 615 510 L 330 510 Z" fill="url(#favOrangeMain)" />
    <path d="M 320 375 L 535 375 L 575 450 C 460 410, 390 400, 320 375 Z" fill="url(#favOrangeGloss)" />
    <path d="M 255 365 L 300 365 L 315 420 L 270 420 Z" fill="#000000" opacity="0.15" />
  </g>
</svg>