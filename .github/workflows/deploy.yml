name: Deploy Aires-BI to cPanel

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout Repository
      # ============================================================
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup Node.js
      # ============================================================
      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================================
      # 3. Build Frontend
      # ============================================================
      - name: 🏗️ Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ============================================================
      # 4. Setup SSH Key for rsync
      # ============================================================
      - name: 🔐 Setup SSH Key
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keygen \
            -p \
            -P "${{ secrets.SSH_PASSPHRASE }}" \
            -N "" \
            -f ~/.ssh/id_rsa

      # ============================================================
      # 5. Deploy Frontend
      # ============================================================
      - name: 🚀 Deploy Frontend to cPanel
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30" \
            frontend/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/airescad/airesbi/

      # ============================================================
      # 6. Deploy Backend
      # ============================================================
      - name: 🚀 Deploy Backend to cPanel
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.htaccess' \
            --exclude 'uploads' \
            --exclude 'tmp' \
            -e "ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30" \
            Backend/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/airescad/biapi/

      # ============================================================
      # 7. Install Dependencies + Prisma Migration + Restart
      # ============================================================
      - name: 🔄 Install Dependencies, Run Prisma Migrations & Restart Node
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}

          script: |
            set -e

            echo "========================================"
            echo "🚀 Starting Aires-BI deployment"
            echo "========================================"

            # --------------------------------------------------------
            # Activate cPanel Node.js environment
            # --------------------------------------------------------
            source /home/airescad/nodevenv/biapi/22/bin/activate

            # --------------------------------------------------------
            # Go to backend
            # --------------------------------------------------------
            cd /home/airescad/biapi

            echo ""
            echo "📦 Installing production dependencies..."
            npm install --omit=dev

            echo ""
            echo "🔧 Generating Prisma Client..."
            npx prisma generate

            echo ""
            echo "🗄️ Applying Prisma migrations..."
            npx prisma migrate deploy

            echo ""
            echo "📁 Ensuring tmp directory exists..."
            mkdir -p /home/airescad/biapi/tmp

            echo ""
            echo "🔄 Restarting Node.js application..."
            touch /home/airescad/biapi/tmp/restart.txt

            echo ""
            echo "========================================"
            echo "✅ Aires-BI deployment completed"
            echo "========================================"
